[project]
name = "llmbenchmark-mcp"
version = "1.0.0"
description = "Which LLM for which task: benchmark scores and API prices for 400+ models as an MCP server. Free, no API key."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "LLMBenchmark.ai", email = "hello@llmbenchmark.ai" }]
keywords = ["llm benchmark", "llm leaderboard", "llm api pricing", "mcp server", "claude", "chatgpt", "cursor", "model comparison"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Software Development"]
dependencies = []

[project.urls]
Homepage = "https://llmbenchmark.ai/api?utm_source=pypi&utm_medium=package&utm_campaign=mcp"
Source = "https://github.com/Take-Group/llmbenchmark-mcp"

[project.scripts]
llmbenchmark-mcp = "llmbenchmark_mcp:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"llmbenchmark_mcp.py" = "llmbenchmark_mcp.py"

[tool.hatch.build.targets.sdist]
include = ["llmbenchmark_mcp.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "server.json", "examples", ".cursor"]
